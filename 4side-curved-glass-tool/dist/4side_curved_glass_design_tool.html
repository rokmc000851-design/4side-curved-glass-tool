<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Side Curved Cover Glass Design Tool</title>
    <style>
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --surface-2: #e9eef1;
  --line: #c5ccd1;
  --line-strong: #7c8790;
  --text: #1d252b;
  --muted: #64717c;
  --accent: #276f86;
  --danger: #b03030;
  --ok: #236b3a;
  --glass: rgba(130, 140, 148, 0.42);
  --oca: rgba(120, 170, 190, 0.32);
  --panel: rgba(66, 72, 78, 0.68);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 320px;
  color: var(--text);
  background: var(--bg);
  font-family: Arial, "Segoe UI", sans-serif;
}

button,
input {
  font: inherit;
}

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-header {
  min-height: 72px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}

.app-header h1 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 0;
}

.app-header p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.toggle-line {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
}

button {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--text);
  padding: 7px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.status-badge {
  min-width: 72px;
  padding: 7px 10px;
  border-radius: 6px;
  text-align: center;
  background: #e8f3eb;
  color: var(--ok);
  border: 1px solid #b7d5c0;
}

.status-badge.error {
  background: #f8eaea;
  color: var(--danger);
  border-color: #e2b4b4;
}

.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(280px, 340px) 1fr;
  min-height: 0;
}

.sidebar {
  padding: 12px;
  overflow: auto;
  border-right: 1px solid var(--line);
  background: var(--surface-2);
}

.panel {
  margin-bottom: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}

.panel h2,
.view-card h2 {
  margin: 0 0 10px;
  font-size: 14px;
}

.input-grid {
  display: grid;
  gap: 9px;
}

.input-row {
  display: grid;
  grid-template-columns: 1fr 92px;
  align-items: center;
  gap: 10px;
}

.input-row label {
  color: var(--muted);
  font-size: 13px;
}

.input-row input {
  width: 100%;
  padding: 6px 7px;
  border: 1px solid var(--line);
  border-radius: 5px;
  text-align: right;
}

.derived-list {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 7px 10px;
  margin: 0;
  font-size: 13px;
}

.derived-list dt {
  color: var(--muted);
}

.derived-list dd {
  margin: 0;
  font-variant-numeric: tabular-nums;
}

.validation-list {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 13px;
}

.validation-list .error {
  color: var(--danger);
}

.view-grid {
  min-width: 0;
  padding: 12px;
  display: grid;
  grid-template-columns: minmax(360px, 1fr) minmax(380px, 1fr);
  gap: 12px;
}

.right-views {
  display: grid;
  grid-template-rows: minmax(240px, 1fr) minmax(260px, 1fr);
  gap: 12px;
  min-width: 0;
}

.top-right-views {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  min-width: 0;
}

.view-card {
  min-height: 240px;
  min-width: 0;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  display: grid;
  grid-template-rows: auto 1fr;
}

.overall-view {
  min-height: 520px;
}

svg {
  width: 100%;
  height: 100%;
  min-height: 190px;
  min-width: 180px;
  display: block;
  background: #fbfcfc;
  border: 1px solid #edf0f1;
  touch-action: none;
  user-select: none;
}

.dim-text {
  fill: #39454d;
  font-size: 0.92px;
  paint-order: stroke;
  stroke: #ffffff;
  stroke-width: 0.22px;
}

.overall-view .dim-text,
#overallTopView .dim-text,
#cornerTopView .dim-text {
  font-size: 2.8px;
  stroke-width: 0.55px;
}

.dimension-line {
  fill: none;
  stroke: #52616a;
  stroke-width: 0.05;
  vector-effect: non-scaling-stroke;
}

.dimension-dashed {
  fill: none;
  stroke: #7b858c;
  stroke-width: 0.05;
  stroke-dasharray: 0.35 0.28;
  vector-effect: non-scaling-stroke;
}

.shape-line {
  fill: none;
  stroke: #68737a;
  stroke-width: 0.06;
  vector-effect: non-scaling-stroke;
}

.projection-guide {
  fill: none;
  stroke: #87929a;
  stroke-width: 0.045;
  stroke-dasharray: 0.28 0.22;
  vector-effect: non-scaling-stroke;
}

.visible-guide {
  fill: none;
  stroke: #8a5a00;
  stroke-width: 0.055;
  vector-effect: non-scaling-stroke;
}

@media (max-width: 980px) {
  .workspace,
  .view-grid,
  .top-right-views {
    grid-template-columns: 1fr;
  }

  .sidebar {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .app-header {
    align-items: flex-start;
    flex-direction: column;
  }
}

</style>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="app-header">
        <div>
          <h1>4-Side Curved Cover Glass Design Tool</h1>
          <p>4-Side Curved Cover Glass Design</p>
        </div>
        <div class="header-actions">
          <label class="toggle-line">
            <input id="showDimensions" type="checkbox" checked>
            Dimensions
          </label>
          <button id="resetViewButton" type="button">Reset All</button>
          <button id="saveJsonButton" type="button">Save JSON</button>
          <button id="loadJsonButton" type="button">Load JSON</button>
          <button id="saveCsvButton" type="button">Save CSV</button>
          <button id="saveSvgButton" type="button">Save SVGs</button>
          <input id="jsonFileInput" class="visually-hidden" type="file" accept="application/json,.json">
          <span id="statusBadge" class="status-badge">Ready</span>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <section class="panel">
            <h2>Input Parameters</h2>
            <form id="inputForm" class="input-grid"></form>
          </section>
          <section class="panel">
            <h2>Derived Parameters</h2>
            <dl id="derivedList" class="derived-list"></dl>
          </section>
          <section class="panel">
            <h2>Validation</h2>
            <div id="validationMessages" class="validation-list"></div>
          </section>
        </aside>

        <section class="view-grid">
          <article class="view-card overall-view">
            <h2>Overall Top View</h2>
            <svg id="overallTopView" role="img" aria-label="Overall top view"></svg>
          </article>
          <div class="right-views">
            <div class="top-right-views">
              <article class="view-card">
                <h2>Corner Side View</h2>
                <svg id="cornerSideView" role="img" aria-label="Corner side view"></svg>
              </article>
              <article class="view-card">
                <h2>Corner Top View</h2>
                <svg id="cornerTopView" role="img" aria-label="Corner top view"></svg>
              </article>
            </div>
            <article class="view-card border-view">
              <h2>Border View</h2>
              <svg id="borderView" role="img" aria-label="Border view"></svg>
            </article>
          </div>
        </section>
      </main>
    </div>
    <script type="module">
// src\js\state.js
const DEFAULT_INPUTS = Object.freeze({
  X: 75,
  Y: 160,
  t: 0.5,
  R: 10,
  D: 1,
  Rc: 10,
  ocaThickness: 0.1,
  panelThickness: 0.1,
  panelSizeOffset: 0.1,
  panelDeadSpace: 0.3
});
function createInitialState() {
  return {
    inputs: { ...DEFAULT_INPUTS },
    showDimensions: true
  };
}



// src\js\geometry\geometryUtils.js
const EPSILON = 1e-9;
function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}
function radiansToDegrees(radians) {
  return radians * 180 / Math.PI;
}
function nearlyEqual(a, b, tolerance = 1e-9) {
  return Math.abs(a - b) <= tolerance;
}
function point(u, z) {
  return { u, z };
}
function distance2(a, b) {
  const du = a.u - b.u;
  const dz = a.z - b.z;
  return du * du + dz * dz;
}
function dot(a, b) {
  return a.u * b.u + a.z * b.z;
}


// src\js\geometry\glassGeometry.js
function computeCoreGeometry(input) {
  const R = Number(input.R);
  const D = Number(input.D);
  const Rc = Number(input.Rc);

  const acosArgument = clamp(1 - D / R, -1, 1);
  const theta = Math.acos(acosArgument);
  const Lb = Math.sqrt(Math.max(0, 2 * R * D - D * D));
  const Sb = R * theta;
  const Rf = Rc - Lb;
  const depthRatio = D / R;
  const cornerShrinkage = Sb <= EPSILON ? 0 : ((Sb - Lb) / Sb) * 100;

  return {
    theta,
    thetaDeg: radiansToDegrees(theta),
    Lb,
    Sb,
    Rf,
    depthRatio,
    cornerShrinkage
  };
}
function glassBottomPoint(alpha, input) {
  const R = Number(input.R);
  return {
    u: R * Math.sin(alpha),
    z: -R * (1 - Math.cos(alpha))
  };
}
function tangentAt(alpha) {
  return {
    u: Math.cos(alpha),
    z: -Math.sin(alpha)
  };
}
function normalAt(alpha) {
  return {
    u: Math.sin(alpha),
    z: Math.cos(alpha)
  };
}
function offsetPoint(basePoint, normal, distance) {
  return {
    u: basePoint.u + distance * normal.u,
    z: basePoint.z + distance * normal.z
  };
}
function glassTopPoint(alpha, input) {
  return offsetPoint(glassBottomPoint(alpha, input), normalAt(alpha), Number(input.t));
}
function sampleGlassSection(input, sampleCount = 40) {
  const core = computeCoreGeometry(input);
  const count = Math.max(2, sampleCount);
  const bottom = [];
  const top = [];

  for (let i = 0; i < count; i += 1) {
    const alpha = core.theta * (i / (count - 1));
    bottom.push(glassBottomPoint(alpha, input));
    top.push(glassTopPoint(alpha, input));
  }

  return {
    bottom,
    top,
    endFace: computeGlassEndFace(input, core)
  };
}
function computeGlassEndFace(input, core = computeCoreGeometry(input)) {
  const alpha = core.theta;
  const bottom = glassBottomPoint(alpha, input);
  const top = glassTopPoint(alpha, input);
  const normal = normalAt(alpha);
  const tangent = tangentAt(alpha);

  return {
    alpha,
    bottom,
    top,
    direction: normal,
    length: Number(input.t),
    tangentDotDirection: dot(tangent, normal),
    description: "End face connects Glass Bottom(theta) to Glass Top(theta) along local normal N(theta)."
  };
}


// src\js\geometry\stackGeometry.js
function computeStackAlphas(input, core) {
  const panelEdgeAlpha = core.theta - Number(input.panelSizeOffset) / Number(input.R);
  const deadInnerAlpha = panelEdgeAlpha - Number(input.panelDeadSpace) / Number(input.R);

  return {
    panelEdgeAlpha,
    deadInnerAlpha,
    panelSizeOffsetArc: Number(input.panelSizeOffset),
    panelDeadSpaceArc: Number(input.panelDeadSpace),
    availablePanelArc: core.Sb - Number(input.panelSizeOffset)
  };
}
function ocaTopPoint(alpha, input) {
  return glassBottomPoint(alpha, input);
}
function ocaBottomPoint(alpha, input) {
  return offsetPoint(ocaTopPoint(alpha, input), normalAt(alpha), -Number(input.ocaThickness));
}
function panelTopPoint(alpha, input) {
  return ocaBottomPoint(alpha, input);
}
function panelBottomPoint(alpha, input) {
  return offsetPoint(panelTopPoint(alpha, input), normalAt(alpha), -Number(input.panelThickness));
}
function stackLayerPoints(alpha, input) {
  return {
    alpha,
    glassBottom: glassBottomPoint(alpha, input),
    ocaTop: ocaTopPoint(alpha, input),
    ocaBottom: ocaBottomPoint(alpha, input),
    panelTop: panelTopPoint(alpha, input),
    panelBottom: panelBottomPoint(alpha, input),
    normal: normalAt(alpha)
  };
}
function sampleStackSection(input, core, sampleCount = 40) {
  const count = Math.max(2, sampleCount);
  const glassBottom = [];
  const ocaTop = [];
  const ocaBottom = [];
  const panelTop = [];
  const panelBottom = [];

  for (let i = 0; i < count; i += 1) {
    const alpha = core.theta * (i / (count - 1));
    const points = stackLayerPoints(alpha, input);
    glassBottom.push(points.glassBottom);
    ocaTop.push(points.ocaTop);
    ocaBottom.push(points.ocaBottom);
    panelTop.push(points.panelTop);
    panelBottom.push(points.panelBottom);
  }

  return {
    glassBottom,
    ocaTop,
    ocaBottom,
    panelTop,
    panelBottom
  };
}
function computeStackReferencePoints(input, core, stack) {
  return {
    glassEdge: stackLayerPoints(core.theta, input),
    panelEdge: stackLayerPoints(stack.panelEdgeAlpha, input),
    deadSpaceInner: stackLayerPoints(stack.deadInnerAlpha, input)
  };
}


// src\js\geometry\borderGeometry.js
const VISIBLE_BORDER_METHOD = Object.freeze({
  id: "glass-top-tangent-intersection-v1",
  opticalSurface: "Glass Top Surface",
  rayStart: "Panel Bottom at alpha_dead_inner",
  rayDirection: "Tangent direction T(alpha_dead_inner), perpendicular to local normal N(alpha_dead_inner)",
  selectionRule: "Find all intersections with Glass Top Surface in [0, theta], then select the valid intersection with largest u.",
  distanceDefinition: "Straight projected distance along u axis from selected intersection V to GlassTop(theta).",
  limitation: "This is a geometric construction only. It does not include refractive-index ray tracing."
});
function computePhysicalBorder(input, core, stack) {
  const left = panelBottomPoint(stack.deadInnerAlpha, input);
  const right = glassTopPoint(core.theta, input);

  return {
    value: Math.abs(right.u - left.u),
    left,
    right
  };
}
function visibleBorderLineSurfaceError(alpha, input, q, direction) {
  const p = glassTopPoint(alpha, input);
  const du = p.u - q.u;
  const dz = p.z - q.z;
  return du * direction.z - dz * direction.u;
}

function refineIntersection(input, q, direction, loAlpha, hiAlpha, loValue) {
  let lo = loAlpha;
  let hi = hiAlpha;
  let fLo = loValue;

  for (let step = 0; step < 64; step += 1) {
    const mid = (lo + hi) / 2;
    const fMid = visibleBorderLineSurfaceError(mid, input, q, direction);
    if (Math.abs(fMid) < EPSILON) {
      lo = mid;
      hi = mid;
      break;
    }
    if (fLo * fMid <= 0) {
      hi = mid;
    } else {
      lo = mid;
      fLo = fMid;
    }
  }

  const alpha = (lo + hi) / 2;
  return {
    alpha,
    point: glassTopPoint(alpha, input),
    residual: visibleBorderLineSurfaceError(alpha, input, q, direction)
  };
}

function pushUniqueIntersection(intersections, candidate) {
  const exists = intersections.some((item) => Math.abs(item.alpha - candidate.alpha) < 1e-7);
  if (!exists) {
    intersections.push(candidate);
  }
}
function findVisibleBorderIntersections(input, core, q, direction, sampleCount = 240) {
  const intersections = [];
  const samples = Math.max(2, sampleCount);

  if (core.theta <= EPSILON) {
    const alpha = 0;
    const residual = visibleBorderLineSurfaceError(alpha, input, q, direction);
    if (Math.abs(residual) < EPSILON) {
      intersections.push({ alpha, point: glassTopPoint(alpha, input), residual });
    }
    return intersections;
  }

  for (let i = 0; i < samples; i += 1) {
    const a0 = core.theta * (i / samples);
    const a1 = core.theta * ((i + 1) / samples);
    const f0 = visibleBorderLineSurfaceError(a0, input, q, direction);
    const f1 = visibleBorderLineSurfaceError(a1, input, q, direction);

    if (Math.abs(f0) < EPSILON) {
      pushUniqueIntersection(intersections, {
        alpha: a0,
        point: glassTopPoint(a0, input),
        residual: f0
      });
    }

    if (Math.abs(f1) < EPSILON) {
      pushUniqueIntersection(intersections, {
        alpha: a1,
        point: glassTopPoint(a1, input),
        residual: f1
      });
    }

    if (f0 * f1 < 0) {
      pushUniqueIntersection(intersections, refineIntersection(input, q, direction, a0, a1, f0));
    }
  }

  return intersections;
}
function selectVisibleBorderIntersection(intersections) {
  if (intersections.length === 0) {
    return null;
  }

  return intersections.reduce((best, candidate) => {
    if (!best || candidate.point.u > best.point.u) {
      return candidate;
    }
    return best;
  }, null);
}
function computeVisibleBorder(input, core, stack) {
  const q = panelBottomPoint(stack.deadInnerAlpha, input);
  const direction = tangentAt(stack.deadInnerAlpha);
  const intersections = findVisibleBorderIntersections(input, core, q, direction);
  const selected = selectVisibleBorderIntersection(intersections);
  const right = glassTopPoint(core.theta, input);
  const metadata = {
    ...VISIBLE_BORDER_METHOD,
    candidateCount: intersections.length,
    candidates: intersections.map((candidate) => ({
      alpha: candidate.alpha,
      point: candidate.point,
      residual: candidate.residual
    }))
  };

  if (!selected) {
    return {
      value: null,
      q,
      intersection: null,
      right,
      alpha: null,
      direction,
      metadata,
      reason: "No stable tangent-line intersection with Glass Top Surface."
    };
  }

  return {
    value: Math.abs(right.u - selected.point.u),
    q,
    intersection: selected.point,
    right,
    alpha: selected.alpha,
    direction,
    metadata: {
      ...metadata,
      selectedAlpha: selected.alpha,
      selectedPoint: selected.point
    },
    reason: null
  };
}


// src\js\validation.js

const POSITIVE_FIELDS = ["X", "Y", "t", "R", "Rc", "ocaThickness", "panelThickness"];
const NUMERIC_FIELDS = [...POSITIVE_FIELDS, "D", "panelSizeOffset", "panelDeadSpace"];
function validateInputs(input) {
  const errors = [];
  const warnings = [];

  for (const field of NUMERIC_FIELDS) {
    if (!Number.isFinite(Number(input[field]))) {
      errors.push(`${field} must be a finite number.`);
    }
  }

  if (errors.length > 0) {
    return { isValid: false, errors, warnings };
  }

  for (const field of POSITIVE_FIELDS) {
    if (!(Number(input[field]) > 0)) {
      errors.push(`${field} must be greater than 0.`);
    }
  }

  if (!(Number(input.D) >= 0)) {
    errors.push("D must be greater than or equal to 0.");
  }

  if (Number(input.R) > 0 && Number(input.D) > 2 * Number(input.R)) {
    errors.push("D must be less than or equal to 2R.");
  }

  if (!(Number(input.panelSizeOffset) >= 0)) {
    errors.push("Panel Size Offset must be greater than or equal to 0.");
  }

  if (!(Number(input.panelDeadSpace) >= 0)) {
    errors.push("Panel Dead Space must be greater than or equal to 0.");
  }

  if (errors.length > 0) {
    return { isValid: false, errors, warnings };
  }

  const core = computeCoreGeometry(input);

  if (core.Rf < -1e-9) {
    errors.push("Rf must be greater than or equal to 0. Rc is smaller than Lb.");
  }

  const flatX = Number(input.X) - 2 * Number(input.Rc);
  const flatY = Number(input.Y) - 2 * Number(input.Rc);
  if (flatX < -1e-9 || flatY < -1e-9) {
    errors.push("Flat top-view region cannot be negative. X and Y must be at least 2Rc.");
  }

  if (Number(input.panelSizeOffset) - core.Sb > 1e-9) {
    errors.push("Panel Size Offset cannot exceed glass bending arc length Sb in v1.");
  }

  const availablePanelArc = core.Sb - Number(input.panelSizeOffset);
  if (Number(input.panelDeadSpace) - availablePanelArc > 1e-9) {
    errors.push("Panel Dead Space exceeds available panel arc length.");
  }

  if (core.Sb === 0 && (Number(input.panelSizeOffset) > 0 || Number(input.panelDeadSpace) > 0)) {
    errors.push("Panel arc offsets must be 0 when D is 0.");
  }

  return {
    isValid: errors.length === 0,
    errors,
    warnings
  };
}


// src\js\geometry\index.js
function computeDesignGeometry(input) {
  const validation = validateInputs(input);

  if (!validation.isValid) {
    return {
      input: { ...input },
      validation,
      core: null,
      stack: null,
      border: null,
      samples: null
    };
  }

  const core = computeCoreGeometry(input);
  const stack = computeStackAlphas(input, core);
  const referencePoints = computeStackReferencePoints(input, core, stack);
  const physical = computePhysicalBorder(input, core, stack);
  const visible = computeVisibleBorder(input, core, stack);
  const surfaces = {
    glass: sampleGlassSection(input),
    stack: sampleStackSection(input, core)
  };

  return {
    input: { ...input },
    validation,
    core,
    stack,
    referencePoints,
    border: {
      physical,
      visible
    },
    samples: surfaces.glass,
    surfaces,
    metadata: {
      units: "mm",
      bendingBasis: "Glass Bottom Surface",
      borderDistanceBasis: "Top View / u-axis straight projection"
    }
  };
}


// src\js\ui\inputPanel.js
const INPUT_DEFINITIONS = [
  ["X", "Glass X"],
  ["Y", "Glass Y"],
  ["t", "Glass Thickness"],
  ["R", "Bending R"],
  ["D", "Bending Depth"],
  ["Rc", "Corner Radius Rc"],
  ["ocaThickness", "OCA Thickness"],
  ["panelThickness", "Panel Thickness"],
  ["panelSizeOffset", "Panel Size Offset Arc"],
  ["panelDeadSpace", "Panel Dead Space Arc"]
];
function mountInputPanel(form, inputs, onChange) {
  form.innerHTML = "";
  for (const [key, labelText] of INPUT_DEFINITIONS) {
    const row = document.createElement("div");
    row.className = "input-row";

    const label = document.createElement("label");
    label.htmlFor = `input-${key}`;
    label.textContent = labelText;

    const input = document.createElement("input");
    input.id = `input-${key}`;

function formatNumber(value, digits = 3) {

  }

  if (!geometry.core) {

  }

  return [
    ["theta", `${formatNumber(geometry.core.thetaDeg, 3)} deg / ${formatNumber(geometry.core.theta, 6)} rad`],
    ["Lb", `${formatNumber(geometry.core.Lb)} mm`],
    ["Sb", `${formatNumber(geometry.core.Sb)} mm`],
    ["Rf", `${formatNumber(geometry.core.Rf)} mm`],
    ["D/R", formatNumber(geometry.core.depthRatio, 2)],
    ["Corner Shrinkage", `${formatNumber(geometry.core.cornerShrinkage, 2)} %`],

    dd.textContent = value;

    item.textContent = "Valid geometry.";
    container.appendChild(item);
  } else {
    for (const error of validation.errors) {
      const item = document.createElement("div");

const MIN_ZOOM = 0.4;

  const limitY = base.height * PAN_LIMIT_FACTOR;

    const ratioX = (event.clientX - rect.left) / Math.max(1, rect.width);
    const ratioY = (event.clientY - rect.top) / Math.max(1, rect.height);

function downloadBlob(filename, blob) {

  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
}
function readJsonFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.addEventListener("load", () => {
      try {
        resolve(JSON.parse(String(reader.result)));
      } catch (error) {
        reject(error);
      }
    });
    reader.addEventListener("error", () => reject(reader.error));
    reader.readAsText(file);
  });
}

function renderOverallTopView(svg, geometry, showDimensions) {

    createLinearGradient("overallGlassShade", [
      { offset: "0%", "stop-color": "#9fa8ad", "stop-opacity": "0.34" },
      { offset: "48%", "stop-color": "#d0d5d8", "stop-opacity": "0.24" },
      { offset: "100%", "stop-color": "#7d878d", "stop-opacity": "0.32" }

      { offset: "55%", "stop-color": "#a7b0b5", "stop-opacity": "0.16" },

    y: 0,
    width: X,
    height: Y,

    ry: Rc,

    stroke: "var(--line-strong)",
    "stroke-width": 0.35
  });

  svg.appendChild(createSvgElement("rect", {
    x: 0,
    y: 0,
    width: X,
    height: Y,
    rx: Rc,
    ry: Rc,
    fill: "url(#overallCornerReflect)",
    stroke: "none"
  }));

  const flat = createSvgElement("rect", {
    x: Rc,
    y: Rc,
    width: Math.max(0, X - 2 * Rc),
    height: Math.max(0, Y - 2 * Rc),
    fill: "none",
    stroke: "var(--line)",
    "stroke-width": 0.25
  });
  svg.appendChild(flat);

  const rInner = Math.max(0, Rf);
  const cornerGuides = [
    `M ${Rc} 0 L ${Rc} ${Y}`,
    `M 0 ${Rc} L ${X} ${Rc}`,
    `M ${X - Rc} 0 L ${X - Rc} ${Y}`,
    `M 0 ${Y - Rc} L ${X} ${Y - Rc}`
  ];
  for (const guide of cornerGuides) {
    svg.appendChild(createSvgElement("path", {
      d: guide,
      fill: "none",
      stroke: "#d5dade",
      "stroke-width": 0.18
    }));
  }
  if (rInner > 0) {
    svg.appendChild(createSvgElement("path", {
      d: `M ${Rc} ${Rc - rInner} A ${rInner} ${rInner} 0 0 0 ${Rc - rInner} ${Rc}`,
      fill: "none",
      stroke: "#c7cdd1",
      "stroke-width": 0.2
    }));
  }

  if (showDimensions) {
    renderDimensionText(svg, X / 2 - 8, -3, `X ${X.toFixed(1)} mm`);
    renderDimensionText(svg, X + 2, Y / 2, `Y ${Y.toFixed(1)} mm`);
  }
}

function renderCornerSideView(svg, geometry, showDimensions) {

  const topArc = surfaces.glass.top;
  const flatLength = Math.max(4, core.Lb * 0.55);
  const bottom = [{ u: -flatLength, z: 0 }, ...bottomArc];
  const top = [{ u: -flatLength, z: geometry.input.t }, ...topArc];
  const center = { u: 0, z: -geometry.input.R };
  setViewBox(svg, -flatLength - 2, -geometry.input.R - 2, Math.max(16, core.Lb + flatLength + 7), Math.max(14, geometry.input.R + geometry.input.t + 7));

      { offset: "0%", "stop-color": "#7e878d", "stop-opacity": "0.36" },
      { offset: "50%", "stop-color": "#c4c9cc", "stop-opacity": "0.30" },
      { offset: "100%", "stop-color": "#8d969b", "stop-opacity": "0.38" }

    stroke: "var(--line-strong)",

  }));
  renderLine(svg, surfaces.glass.endFace.bottom.u, surfaces.glass.endFace.bottom.z, surfaces.glass.endFace.top.u, surfaces.glass.endFace.top.z, "shape-line");

  if (showDimensions) {
    renderLine(svg, center.u, center.z, 0, 0, "dimension-dashed");
    renderLine(svg, center.u, center.z, core.Lb, -geometry.input.D, "dimension-dashed");
    renderPath(svg, arcPath(center.u, center.z, geometry.input.R * 0.28, Math.PI / 2 - core.theta, Math.PI / 2, 1), "dimension-line");

    renderDimensionText(svg, geometry.input.R * 0.16, -geometry.input.R * 0.62, `${core.thetaDeg.toFixed(2)} deg`);
    renderLine(svg, 0, geometry.input.t + 1.1, core.Lb, geometry.input.t + 1.1, "dimension-line");
    renderLine(svg, 0, geometry.input.t + 0.75, 0, geometry.input.t + 1.45, "dimension-line");
    renderLine(svg, core.Lb, geometry.input.t + 0.75, core.Lb, geometry.input.t + 1.45, "dimension-line");
    renderDimensionText(svg, core.Lb * 0.36, geometry.input.t + 2.05, `Lb ${core.Lb.toFixed(3)}`);

    renderLine(svg, core.Lb + 0.55, 0, core.Lb + 1.45, 0, "dimension-line");

    fill: "none",
    stroke: "#65737c",
    "stroke-width": 0.16
  }));
  svg.appendChild(createSvgElement("path", {
    d: `${quarterArc(panelRadius)} L ${polarPoint(0, 0, deadRadius, Math.PI / 2).x} ${polarPoint(0, 0, deadRadius, Math.PI / 2).y} A ${deadRadius} ${deadRadius} 0 0 0 ${deadRadius} 0 Z`,
    fill: "#111111",
    stroke: "none"
  }));
  renderLine(svg, 0, 0, Rc + pad * 0.2, 0, "shape-line");
  renderLine(svg, 0, 0, 0, Rc + pad * 0.2, "shape-line");

  if (showDimensions) {
    renderLine(svg, 0, 0, Rc * 0.72, 0, "dimension-line");
    renderLine(svg, 0, 0, Rf * 0.52, Rf * 0.52, "dimension-line");
    renderDimensionText(svg, Rc * 0.48, -pad * 0.18, `Rc ${Rc.toFixed(3)}`);
    renderDimensionText(svg, Rf * 0.34, Rf * 0.44 + 1.2, `Rf ${Rf.toFixed(3)}`);
    renderPath(svg, arcPath(0, 0, (Rc + panelRadius) / 2, 0.08, 0.5, 1), "dimension-line");
    renderDimensionText(svg, (Rc + panelRadius) * 0.46, (Rc + panelRadius) * 0.14, `Offset arc ${geometry.input.panelSizeOffset.toFixed(3)}`);
    renderPath(svg, arcPath(0, 0, (panelRadius + deadRadius) / 2, 0.92, 1.35, 1), "dimension-line");
    renderDimensionText(svg, (panelRadius + deadRadius) * 0.15, (panelRadius + deadRadius) * 0.48, `Dead arc ${geometry.input.panelDeadSpace.toFixed(3)}`);
  }
}


// src\js\render\borderView.js
function renderBorderView(svg, geometry, showDimensions) {
  clearSvg(svg);
  if (!geometry.core) {
    setViewBox(svg, 0, 0, 100, 60);
    return;
  }

  const { core, border, surfaces } = geometry;
  const glassTop = surfaces.glass.top;
  const glassBottom = surfaces.glass.bottom;
  const ocaBottom = surfaces.stack.ocaBottom;
  const panelBottom = surfaces.stack.panelBottom;
  const height = geometry.input.t + geometry.input.ocaThickness + geometry.input.panelThickness + geometry.input.D + 7;
  setViewBox(svg, -1.8, -geometry.input.D - 2.5, Math.max(13, core.Lb + 7.5), height);
  appendDefs(svg, [
    createLinearGradient("borderGlassShade", [
      { offset: "0%", "stop-color": "#8a9399", "stop-opacity": "0.42" },
      { offset: "60%", "stop-color": "#c6cccf", "stop-opacity": "0.30" },
      { offset: "100%", "stop-color": "#737d84", "stop-opacity": "0.38" }
    ], { x1: "0%", y1: "0%", x2: "100%", y2: "0%" })
  ]);

  svg.appendChild(createSvgElement("path", {
    d: closedPathFromLayers(glassTop, glassBottom),
    fill: "url(#borderGlassShade)",
    stroke: "var(--line-strong)",
    "stroke-width": 0.06
  }));
  svg.appendChild(createSvgElement("path", {
    d: closedPathFromLayers(glassBottom, ocaBottom),
    fill: "var(--oca)",
    stroke: "#6f9ca9",
    "stroke-width": 0.05
  }));
  svg.appendChild(createSvgElement("path", {
    d: closedPathFromLayers(ocaBottom, panelBottom),
    fill: "var(--panel)",
    stroke: "#3f464c",
    "stroke-width": 0.05
  }));

  const deadOuter = geometry.referencePoints.panelEdge.panelBottom;
  const deadInner = geometry.referencePoints.deadSpaceInner.panelBottom;
  const deadRegionTopOuter = geometry.referencePoints.panelEdge.panelTop;
  const deadRegionTopInner = geometry.referencePoints.deadSpaceInner.panelTop;
  svg.appendChild(createSvgElement("path", {
    d: `M ${deadRegionTopInner.u} ${deadRegionTopInner.z} L ${deadRegionTopOuter.u} ${deadRegionTopOuter.z} L ${deadOuter.u} ${deadOuter.z} L ${deadInner.u} ${deadInner.z} Z`,
    fill: "#050505",
    stroke: "none"
  }));

  svg.appendChild(createSvgElement("path", {
    d: pathFromPoints(glassTop),
    fill: "none",
    stroke: "#6d767c",
    "stroke-width": 0.06
  }));

  const glassEnd = border.physical.right;
  const physLeft = border.physical.left;

  svg.appendChild(createSvgElement("circle", {
    cx: physLeft.u,
    cy: physLeft.z,
    r: 0.08,
    fill: "#111111"
  }));
  svg.appendChild(createSvgElement("circle", {
    cx: glassEnd.u,
    cy: glassEnd.z,
    r: 0.08,
    fill: "var(--accent)"
  }));
  renderLine(svg, physLeft.u, physLeft.z, physLeft.u, glassEnd.z - 0.7, "projection-guide");
  renderLine(svg, glassEnd.u, glassEnd.z, glassEnd.u, glassEnd.z - 0.7, "projection-guide");
  svg.appendChild(createSvgElement("line", {
    x1: physLeft.u,
    y1: glassEnd.z - 0.7,
    x2: glassEnd.u,
    y2: glassEnd.z - 0.7,
    stroke: "var(--accent)",
    "stroke-width": 0.05
  }));

  if (border.visible.intersection) {
    renderLine(svg, border.visible.q.u, border.visible.q.z, border.visible.intersection.u, border.visible.intersection.z, "visible-guide");
    renderLine(svg, border.visible.intersection.u, border.visible.intersection.z, border.visible.intersection.u, glassEnd.z - 1.45, "projection-guide");
    renderLine(svg, glassEnd.u, glassEnd.z, glassEnd.u, glassEnd.z - 1.45, "projection-guide");
    renderLine(svg, border.visible.intersection.u, glassEnd.z - 1.45, glassEnd.u, glassEnd.z - 1.45, "visible-guide");
    svg.appendChild(createSvgElement("circle", {
      cx: border.visible.intersection.u,
      cy: border.visible.intersection.z,
      r: 0.08,
      fill: "#8a5a00"
    }));
  }

  if (showDimensions) {
    renderLine(svg, 0.15, 0, 0.15, -geometry.input.ocaThickness, "dimension-line");
    renderDimensionText(svg, 0.35, -geometry.input.ocaThickness * 0.5, `OCA ${geometry.input.ocaThickness.toFixed(3)}`);
    renderLine(svg, 0.55, -geometry.input.ocaThickness, 0.55, -geometry.input.ocaThickness - geometry.input.panelThickness, "dimension-line");
    renderDimensionText(svg, 0.75, -geometry.input.ocaThickness - geometry.input.panelThickness * 0.5, `Panel ${geometry.input.panelThickness.toFixed(3)}`);
    renderPath(svg, arcPath(0, -geometry.input.R, geometry.input.R * 0.86, Math.PI / 2 - core.theta, Math.PI / 2 - geometry.stack.panelEdgeAlpha, 0), "dimension-line");
    renderDimensionText(svg, core.Lb * 0.66, -geometry.input.D - 0.7, `Panel offset arc ${geometry.input.panelSizeOffset.toFixed(3)}`);
    renderPath(svg, arcPath(0, -geometry.input.R, geometry.input.R * 0.75, Math.PI / 2 - geometry.stack.panelEdgeAlpha, Math.PI / 2 - geometry.stack.deadInnerAlpha, 0), "dimension-line");
    renderDimensionText(svg, Math.max(0.6, physLeft.u - 1.4), physLeft.z - 0.45, `Dead arc ${geometry.input.panelDeadSpace.toFixed(3)}`);
    renderDimensionText(svg, physLeft.u, glassEnd.z - 1.05, `Physical ${border.physical.value.toFixed(3)}`);
    const visibleLabel = border.visible.value === null ? "Visible N/A" : `Visible ${border.visible.value.toFixed(3)}`;
    renderDimensionText(svg, border.visible.intersection ? border.visible.intersection.u : 0, glassEnd.z - 1.8, visibleLabel);
  }
}


// src\js\app.js













const state = createInitialState();

const elements = {
  form: document.querySelector("#inputForm"),
  derivedList: document.querySelector("#derivedList"),
  validationMessages: document.querySelector("#validationMessages"),
  statusBadge: document.querySelector("#statusBadge"),
  showDimensions: document.querySelector("#showDimensions"),
  resetViewButton: document.querySelector("#resetViewButton"),
  saveJsonButton: document.querySelector("#saveJsonButton"),
  loadJsonButton: document.querySelector("#loadJsonButton"),
  saveCsvButton: document.querySelector("#saveCsvButton"),
  saveSvgButton: document.querySelector("#saveSvgButton"),
  jsonFileInput: document.querySelector("#jsonFileInput"),
  overallTopView: document.querySelector("#overallTopView"),
  cornerSideView: document.querySelector("#cornerSideView"),
  cornerTopView: document.querySelector("#cornerTopView"),
  borderView: document.querySelector("#borderView")
};

const renderers = [
  ["overallTopView", renderOverallTopView],
  ["cornerSideView", renderCornerSideView],
  ["cornerTopView", renderCornerTopView],
  ["borderView", renderBorderView]
];

const viewTransforms = Object.fromEntries(renderers.map(([id]) => [id, createViewTransform()]));

let lastGeometry = null;
let resizeFrame = 0;

function renderSingleView(id, renderer, geometry) {
  try {
    renderer(elements[id], geometry, state.showDimensions);
    applyViewTransform(elements[id], viewTransforms[id]);
  } catch (error) {
    console.error(`${id} render failed`, error);
    renderError(elements[id], `${id} render failed`);
  }
}

function renderViews(geometry) {
  for (const [id, renderer] of renderers) {
    renderSingleView(id, renderer, geometry);
  }
}

function render() {
  const geometry = computeDesignGeometry(state.inputs);
  lastGeometry = geometry;
  const visibleReason = geometry.border?.visible?.reason ?? null;

  renderOutputPanel(elements.derivedList, geometry);
  renderValidation(elements.validationMessages, geometry.validation, visibleReason);

  elements.statusBadge.textContent = geometry.validation.isValid ? "Valid" : "Invalid";
  elements.statusBadge.classList.toggle("error", !geometry.validation.isValid);

  renderViews(geometry);
}

function setInputValue(key, value) {
  state.inputs[key] = value;
  render();
}

function resetInputs() {
  state.inputs = { ...DEFAULT_INPUTS };
  mountInputPanel(elements.form, state.inputs, setInputValue);
  render();
}

function resetAllViews() {
  for (const transform of Object.values(viewTransforms)) {
    resetTransform(transform);
  }
  if (lastGeometry) {
    renderViews(lastGeometry);
  }
}

function updateInputs(nextInputs) {
  state.inputs = { ...state.inputs, ...nextInputs };
  mountInputPanel(elements.form, state.inputs, setInputValue);
  render();
}

function exportJson() {
  downloadJson("4side-curved-glass-parameters.json", {
    app: "4-Side Curved Cover Glass Design Tool",
    version: "0.1.0",
    inputs: state.inputs
  });
}

async function importJsonFile(file) {
  const json = await readJsonFile(file);
  const nextInputs = json.inputs && typeof json.inputs === "object" ? json.inputs : json;
  updateInputs(filterKnownInputs(nextInputs));
}

function exportCsv() {
  const geometry = lastGeometry ?? computeDesignGeometry(state.inputs);
  const csv = rowsToCsv(derivedGeometryRows(geometry));
  downloadBlob("4side-curved-glass-derived-parameters.csv", new Blob([csv], { type: "text/csv" }));
}

function exportSvgs() {
  for (const [id] of renderers) {
    downloadSvg(`${id}.svg`, elements[id]);
  }
}

function filterKnownInputs(input) {
  const result = {};
  for (const key of Object.keys(DEFAULT_INPUTS)) {
    if (Object.prototype.hasOwnProperty.call(input, key)) {
      result[key] = Number(input[key]);
    }
  }
  return result;
}

mountInputPanel(elements.form, state.inputs, setInputValue);
elements.showDimensions.addEventListener("change", () => {
  state.showDimensions = elements.showDimensions.checked;
  render();
});
bindResetButton(elements.resetViewButton, resetAllViews);
elements.saveJsonButton.addEventListener("click", exportJson);
elements.loadJsonButton.addEventListener("click", () => elements.jsonFileInput.click());
elements.saveCsvButton.addEventListener("click", exportCsv);
elements.saveSvgButton.addEventListener("click", exportSvgs);
elements.jsonFileInput.addEventListener("change", async () => {
  const [file] = elements.jsonFileInput.files;
  if (!file) {
    return;
  }
  try {
    await importJsonFile(file);
  } catch (error) {
    console.error("JSON import failed", error);
    elements.statusBadge.textContent = "Import Error";
    elements.statusBadge.classList.add("error");
  } finally {
    elements.jsonFileInput.value = "";
  }
});
render();

const resizeObserver = new ResizeObserver(() => {
  if (!lastGeometry) {
    return;
  }
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => renderViews(lastGeometry));
});

for (const [id] of renderers) {
  bindViewInteractions(elements[id], viewTransforms[id], () => applyViewTransform(elements[id], viewTransforms[id]));
  resizeObserver.observe(elements[id]);
}

</script>
